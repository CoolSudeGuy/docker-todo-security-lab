apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-lab

resources:
  - ../../base

replicas:
  - name: todo-app
    count: 1

images:
  - name: coolsudeguy/docker-todo-security-lab
    newName: coolsudeguy/docker-todo-security-lab
    newTag: latest

labels:
  - pairs:
      environment: dev
    includeSelectors: false
