apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: gitops-lab
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: web

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: todo-app

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
