name: Docker Build, Security Scan, and Push

on:
  workflow_dispatch:

jobs:
  docker-security:
    name: Build, Scan, and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------
      # ORIGINAL IMAGE
      # ------------------------------------------------------------

      - name: Build original Docker image
        run: |
          docker build \
            --file Dockerfile.original \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original \
            .

      - name: Scan original image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original'
          format: 'table'
          scanners: 'vuln'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '0'

      - name: Push original image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original

      # ------------------------------------------------------------
      # REMEDIATED IMAGE
      # ------------------------------------------------------------

      - name: Build remediated Docker image
        run: |
          docker build \
            --no-cache \
            --file Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated \
            .

      - name: Scan remediated image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated'
          format: 'table'
          scanners: 'vuln'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '0'

      - name: Push remediated image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated

      - name: Tag remediated image as latest
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

      # ------------------------------------------------------------
      # SUMMARY
      # ------------------------------------------------------------

      - name: Create workflow summary
        run: |
          echo "# Docker Container Security Lab" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Images created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original: \`${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediated: \`${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest: \`${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Both images were built, scanned with Trivy, and pushed to Docker Hub." >> "$GITHUB_STEP_SUMMARY"
