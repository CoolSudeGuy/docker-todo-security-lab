name: Docker Build, Security Scan, and Push

on:
  workflow_dispatch:

jobs:
  docker-security:
    name: Build, Scan, and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        shell: bash
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME is missing"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_TOKEN is missing"
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================================
      # ORIGINAL IMAGE
      # ============================================================

      - name: Build original Docker image
        run: |
          docker build \
            --file Dockerfile.original \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original \
            .

      - name: Scan original image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original'
          scan-type: 'image'
          format: 'table'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          hide-progress: true
          exit-code: '0'

      - name: Create original vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original'
          scan-type: 'image'
          format: 'json'
          output: 'trivy-original.json'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '0'

      - name: Display original vulnerability count
        shell: bash
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-original.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-original.json)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-original.json)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-original.json)
          UNKNOWN=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "UNKNOWN")] | length' trivy-original.json)
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW + UNKNOWN))

          echo "=========================================="
          echo " ORIGINAL IMAGE VULNERABILITY BREAKDOWN"
          echo "=========================================="
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original"
          echo ""
          echo "Critical: $CRITICAL"
          echo "High:     $HIGH"
          echo "Medium:   $MEDIUM"
          echo "Low:      $LOW"
          echo "Unknown:  $UNKNOWN"
          echo "Total:    $TOTAL"
          echo "=========================================="

      - name: Push original image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:original

      # ============================================================
      # REMEDIATED IMAGE
      # ============================================================

      - name: Build remediated Docker image
        run: |
          docker build \
            --no-cache \
            --file Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated \
            .

      - name: Scan remediated image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated'
          scan-type: 'image'
          format: 'table'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          hide-progress: true
          exit-code: '0'

      - name: Create remediated vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated'
          scan-type: 'image'
          format: 'json'
          output: 'trivy-remediated.json'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '0'

      - name: Display remediated vulnerability count
        shell: bash
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-remediated.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-remediated.json)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-remediated.json)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-remediated.json)
          UNKNOWN=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "UNKNOWN")] | length' trivy-remediated.json)
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW + UNKNOWN))

          echo "=========================================="
          echo " REMEDIATED IMAGE VULNERABILITY BREAKDOWN"
          echo "=========================================="
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated"
          echo ""
          echo "Critical: $CRITICAL"
          echo "High:     $HIGH"
          echo "Medium:   $MEDIUM"
          echo "Low:      $LOW"
          echo "Unknown:  $UNKNOWN"
          echo "Total:    $TOTAL"
          echo "=========================================="

      - name: Push remediated image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated

      - name: Tag and push latest image
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:remediated \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
