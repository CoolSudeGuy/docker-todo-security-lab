name: Todo App CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todo-app-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: coolsudeguy/docker-todo-security-lab

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect built image
        run: docker image inspect ${{ env.IMAGE_NAME }}:test

  publish:
    name: Publish to Docker Hub
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
