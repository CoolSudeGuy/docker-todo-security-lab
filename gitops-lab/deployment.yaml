apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: gitops-lab
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: prepare-todo-storage
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /etc/todos && chown -R 1000:1000 /etc/todos && chmod -R 770 /etc/todos
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: todo-data
              mountPath: /etc/todos

      containers:
        - name: todo-app
          image: coolsudeguy/todo-app:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: todo-app-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - name: todo-data
              mountPath: /etc/todos

      volumes:
        - name: todo-data
          emptyDir: {}
