apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/CoolSudeGuy/docker-todo-security-lab.git
    targetRevision: main
    path: gitops-lab

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
